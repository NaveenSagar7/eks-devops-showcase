apiVersion: v1
kind: Namespace
metadata:
  name: myapp-dev
  labels:
    name: myapp-dev
    tier: application
    environment: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: myapp-qa
  labels:
    name: myapp-qa
    tier: application
    environment: qa
---
apiVersion: v1
kind: Namespace
metadata:
  name: myapp-prod
  labels:
    name: myapp-prod
    tier: application
    environment: prod
---
# Single shared Postgres namespace for all three app environments - a
# learning-project shortcut, not real environment isolation. Real projects
# would give each environment its own database.
apiVersion: v1
kind: Namespace
metadata:
  name: myapp-db
  labels:
    name: myapp-db
    tier: database
