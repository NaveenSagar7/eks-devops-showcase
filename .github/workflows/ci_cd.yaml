#github ci_cd.yaml for this repository

name: CI/CD Pipeline
on:
  push:
    branches:
      - develop
      - release-qa
      - main
  pull_request:
    branches:
      - develop
      - release-qa
      - main


#jobs -> build, lint, test using sonarqube, build image , test images using trivy, push to ecr, deploy to eks cluster

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Build with Maven
        working-directory: app
        run: mvn clean install
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Lint with Maven
        working-directory: app
        run: mvn checkstyle:check
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarQube analysis
        working-directory: app
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.qualitygate.wait=true
  deploy-dev:
    name: Build, Push and Deploy - Dev
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop'
    #needs: [build, lint, sonarqube]
    environment: dev
    # id-token: write is required so GitHub can issue the OIDC token that
    # configure-aws-credentials exchanges for temporary AWS credentials -
    # without this permission the OIDC assume-role step fails outright.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker
        uses: docker/setup-buildx-action@v2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      # Logs Docker in to this environment's own ECR repo (vars.ECR_REPOSITORY
      # is scoped per-environment now, not shared) and exposes the registry
      # URL as an output so we don't have to hardcode the AWS account id.
      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tags images with the short commit SHA (same 7-char hash GitHub
      # shows next to each commit) instead of :latest, so every image is
      # traceable back to the exact commit it was built from.
      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Builds and loads the image into the local Docker daemon only
      # (push: false, load: true) so Trivy can scan it before anything
      # gets pushed to ECR.
      - name: build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      # Scans the freshly built image for known CVEs. exit-code: '1' fails
      # this step (and stops the job, so the push below never runs) if any
      # CRITICAL or HIGH severity vulnerability is found.
      - name: trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: push docker image
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      # rewrites only the images: entry inside this overlay's
      # kustomization.yaml, never touches the base deployment.yaml itself
      - name: set image tag
        working-directory: k8s/overlays/dev
        run: kustomize edit set image REPLACE_WITH_ECR_REPOSITORY_URL=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: deploy to eks
        run: kubectl apply -k k8s/overlays/dev

      - name: verify rollout
        run: kubectl rollout status deployment/daily-journal -n myapp-dev --timeout=120s

  deploy-qa:
    name: Build, Push and Deploy - QA
    runs-on: ubuntu-latest
    if: github.ref_name == 'release-qa'
    #needs: [build, lint, sonarqube]
    environment: qa
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker
        uses: docker/setup-buildx-action@v2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: push docker image
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: set image tag
        working-directory: k8s/overlays/qa
        run: kustomize edit set image REPLACE_WITH_ECR_REPOSITORY_URL=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: deploy to eks
        run: kubectl apply -k k8s/overlays/qa

      - name: verify rollout
        run: kubectl rollout status deployment/daily-journal -n myapp-qa --timeout=120s

  deploy-prod:
    name: Build, Push and Deploy - Prod
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    #needs: [build, lint, sonarqube]
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker
        uses: docker/setup-buildx-action@v2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: push docker image
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: set image tag
        working-directory: k8s/overlays/prod
        run: kustomize edit set image REPLACE_WITH_ECR_REPOSITORY_URL=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: deploy to eks
        run: kubectl apply -k k8s/overlays/prod

      - name: verify rollout
        run: kubectl rollout status deployment/daily-journal -n myapp-prod --timeout=120s