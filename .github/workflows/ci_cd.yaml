  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # id-token: write is required so GitHub can issue the OIDC token that
    # configure-aws-credentials exchanges for temporary AWS credentials -
    # without this permission the OIDC assume-role step fails outright.
    permissions:
      id-token: write
      contents: read
    #needs: [sonarqube]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker
        uses: docker/setup-buildx-action@v2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Logs Docker in to ECR using the temporary OIDC-assumed credentials,
      # and exposes the account's registry URL as an output so we don't
      # have to hardcode the AWS account id anywhere in this file.
      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tags images with the short commit SHA (same 7-char hash GitHub
      # shows next to each commit) instead of :latest, so every image is
      # traceable back to the exact commit it was built from.
      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
  
  